services:
  mqtt:
    image: eclipse-mosquitto:latest # Use the OpenSSL-specific tag
    user: "1000:1000"
    container_name: mqtt
    restart: always
    ports:
      - "1883:1883"   # Standard MQTT port
      - "9001:9001"   # WebSockets (optional)
      - "8883:8883"   # MQTT over TLS/SSL port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/config/certs:/mosquitto/config/certs # Mount your SSL certificates here
